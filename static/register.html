<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <title>Регистрация</title>
    <style>
        * {
            font-family: 'Montserrat Alternates', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            margin: 0;
            background-image: url('../img/Frame 21.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .animation-container {
            text-align: center;
            background-color: rgba(22, 25, 28, 0.66);
            border-radius: 25px;
            border: 4px solid transparent;
            background-clip: padding-box;
            width: 766px;
            height: 842px;
            margin: 3.1% auto 0;
            position: relative;
        }

        .animation-container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 4px;
            background: linear-gradient(to bottom, #BDEE60, #005436);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
        }
        
        img {
            width: 220px;
            height: auto;
            transition: all 0.1s ease-in-out;
        }
        
        .inputs-container {
            width: 323px;
            height: 64px;
            margin-left: 28.5%;
            margin-top: 5.7%;
        }
        
        .welcome {
            font-size: 30px;
            padding-top: 3.5%;
        }

        .field-group {
            margin-bottom: 20px;
            width: 323px;
            height: 64px;
        }

        .field-group2 {
            margin-top: 13%;
        }
        
        .field-group3 {
            margin-top: 13%;
            position: relative; /* Для абсолютного позиционирования сообщения */
        }
        
        .field-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #999999;
            padding: 5px;
            transition: border-color 0.3s ease;
        }

        .field-wrapper:focus-within {
            border-bottom-color: #BDEE60;
        }

        .field-input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            width: 100%;
            margin-top: -1%;
        }
        
        .username {
            padding-right: 51%;
            font-size: 14px;
            color: #999999;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .password {
            padding-right: 79%;
            font-size: 14px;
            color: #999999;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .password2 {
            margin-right: 45%;
            font-size: 14px;
            color: #999999;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .field-input::placeholder {
            color: #999999;
        }
        
        .icon_user {
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }
        
        .icon_lock {
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }
        
        .btn {
            width: 323px;
            height: 48.71px;
            background-color: transparent;
            margin-top: -2%;
            color: white;
            border: 1px solid #ffffff;
            border-radius: 32px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .TEXT {
            margin-top: 7%;
            margin-left: -24%;
            width: 475px;
            height: 29px;
            color: #fff;
            font-size: 16px;
        }
        
        .link {
            color: #717A84;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #BDEE60;
            text-decoration: underline;
        }
        
        .message {
            margin-top: -20px;
            font-size: 14px;
            color: #ff6b6b;
            height: 20px; /* Фиксированная высота чтобы не смещало */
        }

        /* Стили для подсказок пароля */
        .password-hints {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(22, 25, 28, 0.8);
            border-radius: 8px;
            font-size: 12px;
            animation: fadeInUp 0.5s ease-out;
        }

        .password-hints ul {
            list-style-type: none;
            padding-left: 5px;
            margin: 5px 0 0 0;
        }

        .password-hints li {
            margin-bottom: 3px;
            position: relative;
            padding-left: 20px;
            transition: color 0.3s ease;
        }

        .password-hints li:before {
            content: "✖";
            position: absolute;
            left: 0;
            color: #ff4444;
        }

        .password-hints li.valid:before {
            content: "✓";
            color: #00C851;
        }

        .password-strength {
            height: 5px;
            background: #333;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff4444, #00C851);
            transition: width 0.3s ease, background 0.3s ease;
        }

        /* ФИКСИРОВАННОЕ МЕСТО ДЛЯ СООБЩЕНИЯ О НЕСОВПАДЕНИИ */
        .password-match-container {
            height: 25px; /* Фиксированная высота */
            margin-top: 5px;
            position: relative;
        }

        #password-match {
            color: #ff4444;
            font-size: 12px;
            margin: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: left;
        }

        #password-match.visible {
            opacity: 1;
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animation-container {
            animation: fadeInUp 0.8s ease-out;
        }

        #character {
            animation: pulse 2s ease-in-out infinite;
        }

        .welcome {
            animation: slideInFromTop 0.8s ease-out 0.2s both;
        }

        .field-group {
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .field-group2 {
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .field-group3 {
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .btn {
            animation: fadeInUp 0.8s ease-out 1.0s both;
        }

        .TEXT {
            animation: fadeInUp 0.8s ease-out 1.2s both;
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .animation-container {
                width: 90%;
                height: auto;
                min-height: 800px;
                margin: 10% auto;
                padding: 40px 30px;
            }
            
            .inputs-container {
                width: 100%;
                max-width: 323px;
                height: auto;
                margin-left: auto;
                margin-right: auto;
            }
            
            .field-group {
                width: 100%;
            }
            
            .TEXT {
                width: 100%;
                max-width: 475px;
                margin: 7% auto 0;
                margin-left: 0;
            }
            
            .btn {
                width: 100%;
                max-width: 323px;
                margin-top: 9%;
            }
            
            .username, .password, .password2 {
                padding-right: 0;
                text-align: center;
            }
            
            .password2 {
                margin-right: 0;
            }
        }

        @media (max-width: 768px) {
            .animation-container {
                width: 95%;
                min-height: 750px;
                padding: 30px 20px;
                margin: 5% auto;
            }
            
            #character {
                width: 180px;
            }
            
            .welcome {
                font-size: 26px;
                padding-top: 2%;
            }
            
            .field-group2, .field-group3 {
                margin-top: 8%;
            }
            
            .btn {
                margin-top: 8%;
                height: 45px;
                font-size: 16px;
            }
            
            .TEXT {
                margin-top: 5%;
                font-size: 15px;
            }
            
            .password-hints {
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }
            
            .animation-container {
                width: 100%;
                min-height: 700px;
                padding: 25px 15px;
                margin: 0;
            }
            
            #character {
                width: 150px;
            }
            
            .welcome {
                font-size: 24px;
                padding-top: 1%;
            }
            
            .inputs-container {
                width: 100%;
            }
            
            .field-group {
                margin-bottom: 15px;
                height: auto;
            }
            
            .field-group2, .field-group3 {
                margin-top: 6%;
            }
            
            .username, .password, .password2 {
                font-size: 13px;
            }
            
            .field-input {
                font-size: 14px;
            }
            
            .btn {
                height: 42px;
                font-size: 15px;
                margin-top: 6%;
            }
            
            .TEXT {
                font-size: 14px;
                margin-top: 4%;
                height: auto;
            }
            
            .icon_user, .icon_lock {
                width: 14px;
                height: 14px;
            }
            
            .password-hints {
                font-size: 10px;
                padding: 8px;
            }
        }

        @media (max-width: 320px) {
            .welcome {
                font-size: 22px;
            }
            
            .field-input {
                font-size: 13px;
            }
            
            .btn {
                height: 40px;
                font-size: 14px;
            }
            
            .TEXT {
                font-size: 13px;
            }
            
            .password-hints {
                font-size: 9px;
            }
        }

        /* Плавная прокрутка */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <h1 class="welcome">Регистрация</h1>
        <img id="character" src="/img/Сова пнг без фона/1.png" alt="Человек" />

        <div class="inputs-container">
            <div class="field-group">
                <label class="username">Имя пользователя</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/user 1.svg" class="icon_user">
                    <input class="field-input" id="input1" type="text" placeholder="Введите ваше имя пользователя" />
                </div>
            </div>

            <div class="field-group2">
                <label class="password">Пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input2" type="password" placeholder="Введите ваш пароль" />
                </div>
                <!-- Блок с подсказками -->
                <div class="password-hints">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <ul>
                        <li id="length-hint">Минимум 8 символов</li>
                        <li id="number-hint">Содержит цифру</li>
                        <li id="upper-hint">Содержит заглавную букву</li>
                        <li id="special-hint">Содержит спецсимвол (!@#$% и т.д.)</li>
                    </ul>
                </div>
            </div>

            <div class="field-group3">
                <label class="password2">Подтвердите пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input3" type="password" placeholder="Подтвердите ваш пароль" />
                </div>
                <div class="password-match-container">
                    <p id="password-match">Пароли не совпадают</p>
                </div>
            </div>

            <button type="button" class="btn" onclick="register()">Регистрация</button>
            <p class="TEXT">Если у вас есть аккаунт, войдите <a href="login.html" class="link">здесь!</a></p>
            <p class="message" id="message"></p>
        </div>
    </div>

    <script>
        const character = document.getElementById('character');
        const input1 = document.getElementById('input1');
        const input2 = document.getElementById('input2');
        const input3 = document.getElementById('input3');
        const registerButton = document.getElementById('registerButton');
        let currentFrame = 5;

        let input2Active = false;
        let animationInterval = null;

        function playAnimation(startFrame, endFrame, callback) {
            clearInterval(animationInterval);
            let frame = startFrame;
            animationInterval = setInterval(() => {
                character.src = `/img/Сова пнг без фона/${frame}.png`;
                frame++;
                if (frame > endFrame) {
                    clearInterval(animationInterval);
                    if (callback) callback();
                }
            }, 1);
        }

        input1.addEventListener('focus', function() {
            playAnimation(currentFrame, 5);
        });

        input1.addEventListener('input', function(event) {
            if (event.inputType === "deleteContentBackward") {
                if (currentFrame > 5) {
                    currentFrame--;
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                }
            } else {
                if (currentFrame < 26) {
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                    currentFrame++;
                }
            }
        });

        input1.addEventListener('blur', function() {
            if (!input2.matches(':focus')) {
                playAnimation(currentFrame, 30);
            }
        });

        input2.addEventListener('focus', function() {
            clearInterval(animationInterval);
            if (!input2Active) {
                playAnimation(26, 32);
                input2Active = true;
            }
        });

        input3.addEventListener('focus', function() {
            clearInterval(animationInterval);
            if (!input2Active) {
                playAnimation(26, 32);
                input2Active = true;
            }
        });

        input2.addEventListener('input', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('focus', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('blur', function() {
            character.src = "/img/Сова пнг без фона/1.png";
        });

        input3.addEventListener('input', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input3.addEventListener('focus', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input3.addEventListener('blur', function() {
            character.src = "/img/Сова пнг без фона/1.png";
        });

        function checkPasswordComplexity(password) {
            const hasMinLength = password.length >= 8;
            const hasNumber = /\d/.test(password);
            const hasUpper = /[A-ZА-Я]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            // Обновляем подсказки
            document.getElementById('length-hint').classList.toggle('valid', hasMinLength);
            document.getElementById('number-hint').classList.toggle('valid', hasNumber);
            document.getElementById('upper-hint').classList.toggle('valid', hasUpper);
            document.getElementById('special-hint').classList.toggle('valid', hasSpecial);

            // Рассчитываем сложность пароля (0-4)
            const strength = [hasMinLength, hasNumber, hasUpper, hasSpecial].filter(Boolean).length;
            document.getElementById('strengthBar').style.width = `${strength * 25}%`;

            return hasMinLength && hasNumber && hasUpper && hasSpecial;
        }

        function checkPasswordsMatch() {
            const password = input2.value;
            const confirmPassword = input3.value;
            const matchElement = document.getElementById('password-match');

            if (password && confirmPassword) {
                if (password !== confirmPassword) {
                    matchElement.style.display = 'block';
                    return false;
                } else {
                    matchElement.style.display = 'none';
                    return true;
                }
            }
            matchElement.style.display = 'none';
            return false;
        }

        function validateForm() {
            const usernameValid = input1.value.trim().length > 0;
            const passwordValid = checkPasswordComplexity(input2.value);
            const passwordsMatch = checkPasswordsMatch();

            registerButton.disabled = !(usernameValid && passwordValid && passwordsMatch);
        }

        // Слушатели событий
        input1.addEventListener('input', validateForm);
        input2.addEventListener('input', validateForm);
        input3.addEventListener('input', validateForm);

        async function register() {
            const username = input1.value.trim();
            const password = input2.value;
            const confirmPassword = input3.value;
            const message = document.getElementById("message");

            // Дополнительная проверка перед отправкой
            if (!checkPasswordComplexity(password)) {
                message.textContent = "Пароль не соответствует требованиям";
                message.style.color = "red";
                return;
            }

<!--            if (password !== confirmPassword) {-->
<!--                message.textContent = "Пароли не совпадают";-->
<!--                message.style.color = "red";-->
<!--                return;-->
<!--            }-->

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password,
                        confirm_password: confirmPassword
                    }),
                    credentials: "include"
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = "Регистрация успешна! Перенаправление...";
                    message.style.color = "green";

                    // Проверяем авторизацию и перенаправляем
                    const authCheck = await fetch("/api/check-auth", {
                        credentials: "include"
                    });

                    if (authCheck.ok) {
                        window.location.href = "/static/tasks.html";
                    } else {
                        window.location.href = "/static/login.html";
                    }
                } else {
                    message.textContent = result.detail || "Ошибка регистрации";
                    message.style.color = "red";
                }
            } catch (error) {
                message.textContent = "Ошибка соединения с сервером";
                message.style.color = "red";

                console.error("Ошибка регистрации:", error);
            }
        }

        // Назначаем обработчик на кнопку
        registerButton.addEventListener('click', register);
    </script>
</body>
</html>
