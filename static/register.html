<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <title>Регистрация</title>
    <style>
        * {
            font-family: 'Montserrat Alternates', sans-serif;
        }
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000;
            color: #fff;
            margin: 0;
            background-image: url('../img/Frame 21.png');
        }

        .animation-container {
            text-align: center;
            background-color: rgba(22, 25, 28, 0.66);
            border-radius: 25px;
            border: 4px solid transparent;
            background-clip: padding-box;
            width: 766px;
            height: 842px;
            margin-top: 3%;
            margin-left: 1%;
        }

        .animation-container::before {
            width: 766px;
            height: 842px;
            margin-top: 4%;
            margin-left: 30.4%;
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 4px;
            background: linear-gradient(to bottom, #BDEE60, #005436);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            z-index: -1;
        }
        img {
            width: 220px;
            height: auto;
            transition: all 0.1s ease-in-out;
        }
        input {
            margin-top: 10px;
            padding: 8px;
            font-size: 16px;
            width: 200px;
            background-color: #333;
            color: #fff;
            border: 1px solid #444;
            border-radius: 5px;
            display: flex;
            margin-left: auto;
            margin-right: auto;
        }

        .inputs-container {
            width: 323px;
            height: 64px;
            margin-left: 28.5%;
            margin-top: 5.7%;
        }
        .welcome {
            font-size: 30px;
            padding-top: 3.5%;
        }

        .field-group {
            margin-bottom: 20px;
        }

        .field-group2 {
            margin-top: 13%;
        }
        .field-group3 {
            margin-top: 13%;
        }
        .field-label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .field-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #999999;
            padding: 5px;
        }

        .field-icon {
            color: #ccc;
            margin-right: 10px;
        }

        .field-input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            width: 100%;
            margin-top: -1%;
        }
        .username {
            padding-right: 51%;
            padding-top: -10%;
            font-size: 14px;
            color: #999999;
        }
        .password {
            padding-right: 79%;
            font-size: 14px;
            color: #999999;
        }
        .password2 {
            margin-right: 45%;
            font-size: 14px;
            color: #999999;
        }
        .field-input::placeholder {
            color: #999999;
        }
        .icon_user {
            width: 16px;
            height: 16px;
        }
        .icon_lock {
            width: 16px;
            height: 16px;
        }
        .btn {
            width: 323px;
            height: 48.71px;
            background-color: transparent;
            margin-top: 9.8%;
            color: white;
            border: 1px solid #ffffff;
            border-radius: 32px;
            font-size: 17px;
            cursor: pointer;
        }
        .TEXT {
            margin-top: 22%;
            margin-left: -24%;
            width: 475px;
            height: 29px;
            color: #fff;
            font-size: 16px;
        }
        .link {
            color: #717A84;
        }
        .field-group {
            width: 323px;
            height: 64px;
        }
        .message {
            margin-top: 10px;
            font-size: 14px;
        }

        /* Добавляем новые стили для подсказок */
        .password-hints {
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(22, 25, 28, 0.8);
            border-radius: 8px;
            font-size: 12px;
        }

        .password-hints ul {
            list-style-type: none;
            padding-left: 5px;
            margin: 5px 0 0 0;
        }

        .password-hints li {
            margin-bottom: 3px;
            position: relative;
            padding-left: 20px;
        }

        .password-hints li:before {
            content: "✖";
            position: absolute;
            left: 0;
            color: #ff4444;
        }

        .password-hints li.valid:before {
            content: "✓";
            color: #00C851;
        }

        .password-strength {
            height: 5px;
            background: #333;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #ff4444, #00C851);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <h1 class="welcome">Регистрация</h1>
        <img id="character" src="/img/Сова пнг без фона/1.png" alt="Человек" />

        <div class="inputs-container">
            <div class="field-group">
                <label class="username">Имя пользователя</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/user 1.svg" class="icon_user">
                    <input class="field-input" id="input1" type="text" placeholder="Введите ваше имя пользователя" />
                </div>
            </div>

            <div class="field-group2">
                <label class="password">Пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input2" type="password" placeholder="Введите ваш пароль" />
                </div>
                <!-- Добавляем блок с подсказками -->
                <div class="password-hints">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <ul>
                        <li id="length-hint">Минимум 8 символов</li>
                        <li id="number-hint">Содержит цифру</li>
                        <li id="upper-hint">Содержит заглавную букву</li>
                        <li id="special-hint">Содержит спецсимвол (!@#$% и т.д.)</li>
                    </ul>
                </div>
            </div>

            <div class="field-group3">
                <label class="password2">Подтвердите пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input3" type="password" placeholder="Подтвердите ваш пароль" />
                </div>
                <p id="password-match" style="color: #ff4444; font-size: 12px; margin-top: 5px; display: none;">Пароли не совпадают</p>
            </div>

            <button type="button" class="btn" onclick="register()">Регистрация</button>
            <p class="TEXT">Если у вас есть аккаунт, войдите <a href="login.html" class="link">здесь!</a></p>
            <p class="message" id="message"></p>
        </div>
    </div>

    <script>
        const character = document.getElementById('character');
        const input1 = document.getElementById('input1');
        const input2 = document.getElementById('input2');
        const input3 = document.getElementById('input3');
        const registerButton = document.getElementById('registerButton');
        let currentFrame = 5;

        let input2Active = false;
        let animationInterval = null;

        function playAnimation(startFrame, endFrame, callback) {
            clearInterval(animationInterval);
            let frame = startFrame;
            animationInterval = setInterval(() => {
                character.src = `/img/Сова пнг без фона/${frame}.png`;
                frame++;
                if (frame > endFrame) {
                    clearInterval(animationInterval);
                    if (callback) callback();
                }
            }, 1);
        }

        input1.addEventListener('focus', function() {
            playAnimation(currentFrame, 5);
        });

        input1.addEventListener('input', function(event) {
            if (event.inputType === "deleteContentBackward") {
                if (currentFrame > 5) {
                    currentFrame--;
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                }
            } else {
                if (currentFrame < 26) {
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                    currentFrame++;
                }
            }
        });

        input1.addEventListener('blur', function() {
            if (!input2.matches(':focus')) {
                playAnimation(currentFrame, 30);
            }
        });

        input2.addEventListener('focus', function() {
            clearInterval(animationInterval);
            if (!input2Active) {
                playAnimation(26, 32);
                input2Active = true;
            }
        });

        input3.addEventListener('focus', function() {
            clearInterval(animationInterval);
            if (!input2Active) {
                playAnimation(26, 32);
                input2Active = true;
            }
        });

        input2.addEventListener('input', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('focus', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('blur', function() {
            character.src = "/img/Сова пнг без фона/1.png";
        });

        input3.addEventListener('input', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input3.addEventListener('focus', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input3.addEventListener('blur', function() {
            character.src = "/img/Сова пнг без фона/1.png";
        });

        function checkPasswordComplexity(password) {
            const hasMinLength = password.length >= 8;
            const hasNumber = /\d/.test(password);
            const hasUpper = /[A-ZА-Я]/.test(password);
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(password);

            // Обновляем подсказки
            document.getElementById('length-hint').classList.toggle('valid', hasMinLength);
            document.getElementById('number-hint').classList.toggle('valid', hasNumber);
            document.getElementById('upper-hint').classList.toggle('valid', hasUpper);
            document.getElementById('special-hint').classList.toggle('valid', hasSpecial);

            // Рассчитываем сложность пароля (0-4)
            const strength = [hasMinLength, hasNumber, hasUpper, hasSpecial].filter(Boolean).length;
            document.getElementById('strengthBar').style.width = `${strength * 25}%`;

            return hasMinLength && hasNumber && hasUpper && hasSpecial;
        }

        function checkPasswordsMatch() {
            const password = input2.value;
            const confirmPassword = input3.value;
            const matchElement = document.getElementById('password-match');

            if (password && confirmPassword) {
                if (password !== confirmPassword) {
                    matchElement.style.display = 'block';
                    return false;
                } else {
                    matchElement.style.display = 'none';
                    return true;
                }
            }
            matchElement.style.display = 'none';
            return false;
        }

        function validateForm() {
            const usernameValid = input1.value.trim().length > 0;
            const passwordValid = checkPasswordComplexity(input2.value);
            const passwordsMatch = checkPasswordsMatch();

            registerButton.disabled = !(usernameValid && passwordValid && passwordsMatch);
        }

        // Слушатели событий
        input1.addEventListener('input', validateForm);
        input2.addEventListener('input', validateForm);
        input3.addEventListener('input', validateForm);

        async function register() {
            const username = input1.value.trim();
            const password = input2.value;
            const confirmPassword = input3.value;
            const message = document.getElementById("message");

            // Дополнительная проверка перед отправкой
            if (!checkPasswordComplexity(password)) {
                message.textContent = "Пароль не соответствует требованиям";
                message.style.color = "red";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent = "Пароли не совпадают";
                message.style.color = "red";
                return;
            }

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: new URLSearchParams({
                        username: username,
                        password: password,
                        confirm_password: confirmPassword
                    }),
                    credentials: "include"
                });

                const result = await response.json();

                if (response.ok) {
                    message.textContent = "Регистрация успешна! Перенаправление...";
                    message.style.color = "green";

                    // Проверяем авторизацию и перенаправляем
                    const authCheck = await fetch("/api/check-auth", {
                        credentials: "include"
                    });

                    if (authCheck.ok) {
                        window.location.href = "/static/tasks.html";
                    } else {
                        window.location.href = "/static/login.html";
                    }
                } else {
                    message.textContent = result.detail || "Ошибка регистрации";
                    message.style.color = "red";
                }
            } catch (error) {
                message.textContent = "Ошибка соединения с сервером";
                message.style.color = "red";
                console.error("Ошибка регистрации:", error);
            }
        }

        // Назначаем обработчик на кнопку
        registerButton.addEventListener('click', register);
    </script>
</body>
</html>
