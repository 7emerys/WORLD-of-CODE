<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/register.css">
    <script src="/JS_scripts/register.js"></script>
    <title>Регистрация</title>

</head>
<body>
    <div class="animation-container">
        <h1 class="welcome">Регистрация</h1>
        <img id="character" src="/img/Сова пнг без фона/1.png" alt="Человек" />

        <div class="inputs-container">
            <div class="field-group">
                <label class="username">Имя пользователя</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/user 1.svg" class="icon_user">
                    <input class="field-input" id="input1" type="text" placeholder="Введите ваше имя пользователя" />
                </div>
            </div>

            <div class="field-group2">
                <label class="password">Пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input2" type="password" placeholder="Введите ваш пароль" />
                </div>
                <!-- Блок с подсказками -->
                <div class="password-hints">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <ul>
                        <li id="length-hint">Минимум 8 символов</li>
                        <li id="number-hint">Содержит цифру</li>
                        <li id="upper-hint">Содержит заглавную букву</li>
                        <li id="special-hint">Содержит спецсимвол (!@#$% и т.д.)</li>
                    </ul>
                </div>
            </div>

            <div class="field-group3">
                <label class="password2">Подтвердите пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input3" type="password" placeholder="Подтвердите ваш пароль" />
                </div>
                <div class="password-match-container">
                    <p id="password-match">Пароли не совпадают</p>
                </div>
            </div>

            <button type="button" class="btn" onclick="register()">Регистрация</button>
            <p class="TEXT">Если у вас есть аккаунт, войдите <a href="login.html" class="link">здесь!</a></p>
            <p class="message" id="message"></p>
        </div>
    </div>

</body>
</html>
