<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/achievements.css">
    <script src="/JS_scripts/achievements.js"></script>

    <title>Настройки аккаунта</title>
</head>
<body>
   <div class="header-container">
    <a href="/static/index.html">
        <img src="/img/worldofcode.png" alt="World of CODE" class="woc">
    </a>
</div>
    <div class="center-container">
        <div class="container">
            <div class="header">
                <div class="logo-container">
                    <img id="logo" src="" class="logo" alt="Аватар">
                </div>
                <div class="profile-actions">
                    <div class="profile-name">Emerys</div>
                    <div class="profile-buttons">
                        <a href="profile.html">
                            <button class="profile-btn">Обо мне</button>
                        </a>
                        <button class="profile-btn active">Статистика</button>
                        <a href="statistics.html">
                            <button class="profile-btn">Достижения</button>
                        </a>
                    </div>
                </div>
            </div>
            <div class="pseudo-container">
                <div class="pseudo-input-wrapper2">
                    <div class="pseudo-input-border2"></div>
                    <div class="pseudo-input2">
                        <div class="tasks-grid">
                            <div class="taski">
                                <div class="taski-content">
                                    <img src="/img/достижения/Group 288897.png" class="taski-img" alt="Решенные задачи">
                                    <div class="taski-text">
                                        <span class="taski-count">55</span>
                                        <span class="taski-label">решенных задач</span>
                                    </div>
                                </div>
                            </div>
                            <div class="taski">
                                <div class="taski-content">
                                    <img src="/img/достижения/Group 289104.png" class="taski-img" alt="Дни подряд">
                                    <div class="taski-text">
                                        <span class="taski-count">12</span>
                                        <span class="taski-label">дней подряд</span>
                                    </div>
                                </div>
                            </div>
                            <div class="taski">
                                <div class="taski-content">
                                    <img src="/img/достижения/Group 289524.png" class="taski-img" alt="Уровень">
                                    <div class="taski-text">
                                        <span class="taski-count">3</span>
                                        <span class="taski-label">уровень</span>
                                    </div>
                                </div>
                            </div>
                            <div class="taski">
                                <div class="taski-content">
                                    <img src="/img/достижения/Group 28897.png" class="taski-img" alt="Часы обучения">
                                    <img src="/img/достижения/Group 481710.png" class="taski-img-dop" alt="Дополнительная иконка">
                                    <div class="taski-text">
                                        <span class="taski-count">24</span>
                                        <span class="taski-label">часа обучения</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
