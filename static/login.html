<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <title>Вход</title>
    <style>
        * {
            font-family: 'Montserrat Alternates', sans-serif;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            margin: 0;
            background-image: url('../img/Frame 21.png');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .animation-container {
            text-align: center;
            background-color: rgba(22, 25, 28, 0.66);
            border-radius: 25px;
            border: 4px solid transparent;
            background-clip: padding-box;
            width: 766px;
            height: 842px;
            margin: 4.2% auto 0;
            position: relative;
        }

        .animation-container::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 25px;
            padding: 4px;
            background: linear-gradient(to bottom, #BDEE60, #005436);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            z-index: -1;
        }

        img {
            width: 220px;
            height: auto;
            transition: all 0.1s ease-in-out;
        }

        .inputs-container {
            width: 323px;
            height: 64px;
            margin-left: 28.5%;
            margin-top: 5.7%;
        }
        
        .welcome {
            font-size: 30px;
            padding-top: 3.5%;
        }

        .field-group {
            margin-bottom: 20px;
            width: 323px;
            height: 64px;
        }

        .field-group2 {
            margin-top: 13%;
        }
        
        .field-wrapper {
            display: flex;
            align-items: center;
            border-bottom: 1px solid #999999;
            padding: 5px;
            transition: border-color 0.3s ease;
        }

        .field-wrapper:focus-within {
            border-bottom-color: #BDEE60;
        }

        .field-input {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            width: 100%;
            margin-top: -1%;
        }
        
        .username {
            padding-right: 51%;
            font-size: 14px;
            color: #999999;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .password {
            padding-right: 79%;
            font-size: 14px;
            color: #999999;
            display: block;
            margin-bottom: 5px;
            text-align: left;
        }
        
        .field-input::placeholder {
            color: #999999;
        }
        
        .icon_user {
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }
        
        .icon_lock {
            width: 16px;
            height: 16px;
            margin-right: 10px;
        }
        
        .btn {
            width: 323px;
            height: 48.71px;
            background-color: transparent;
            margin-top: 23%;
            color: white;
            border: 1px solid #ffffff;
            border-radius: 32px;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .TEXT {
            margin-top: 22%;
            margin-left: -24%;
            width: 475px;
            height: 29px;
            color: #fff;
            font-size: 16px;
        }
        
        .link {
            color: #717A84;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .link:hover {
            color: #BDEE60;
            text-decoration: underline;
        }
        
        .message {
            margin-top: 10px;
            font-size: 14px;
            color: #ff6b6b;
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes slideInFromTop {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animation-container {
            animation: fadeInUp 0.8s ease-out;
        }

        #character {
            animation: pulse 2s ease-in-out infinite;
        }

        .welcome {
            animation: slideInFromTop 0.8s ease-out 0.2s both;
        }

        .field-group {
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }

        .field-group2 {
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }

        .btn {
            animation: fadeInUp 0.8s ease-out 0.8s both;
        }

        .TEXT {
            animation: fadeInUp 0.8s ease-out 1.0s both;
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .animation-container {
                width: 90%;
                height: auto;
                min-height: 700px;
                margin: 10% auto;
                padding: 40px 30px;
            }
            
            .inputs-container {
                width: 100%;
                max-width: 323px;
                height: auto;
                margin-left: auto;
                margin-right: auto;
            }
            
            .field-group {
                width: 100%;
            }
            
            .TEXT {
                width: 100%;
                max-width: 475px;
                margin: 15% auto 0;
                margin-left: 0;
            }
            
            .btn {
                width: 100%;
                max-width: 323px;
                margin-top: 15%;
            }
            
            .username, .password {
                padding-right: 0;
                text-align: center;
            }
        }

        @media (max-width: 768px) {
            .animation-container {
                width: 95%;
                min-height: 650px;
                padding: 30px 20px;
                margin: 5% auto;
            }
            
            #character {
                width: 180px;
            }
            
            .welcome {
                font-size: 26px;
                padding-top: 2%;
            }
            
            .field-group2 {
                margin-top: 8%;
            }
            
            .btn {
                margin-top: 12%;
                height: 45px;
                font-size: 16px;
            }
            
            .TEXT {
                margin-top: 12%;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }
            
            .animation-container {
                width: 100%;
                min-height: 600px;
                padding: 25px 15px;
                margin: 0;
            }
            
            #character {
                width: 150px;
            }
            
            .welcome {
                font-size: 24px;
                padding-top: 1%;
            }
            
            .inputs-container {
                width: 100%;
            }
            
            .field-group {
                margin-bottom: 15px;
                height: auto;
            }
            
            .field-group2 {
                margin-top: 6%;
            }
            
            .username, .password {
                font-size: 13px;
            }
            
            .field-input {
                font-size: 14px;
            }
            
            .btn {
                height: 42px;
                font-size: 15px;
                margin-top: 10%;
            }
            
            .TEXT {
                font-size: 14px;
                margin-top: 10%;
                height: auto;
            }
            
            .icon_user, .icon_lock {
                width: 14px;
                height: 14px;
            }
        }

        @media (max-width: 320px) {
            .welcome {
                font-size: 22px;
            }
            
            .field-input {
                font-size: 13px;
            }
            
            .btn {
                height: 40px;
                font-size: 14px;
            }
            
            .TEXT {
                font-size: 13px;
            }
        }

        /* Плавная прокрутка */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="animation-container">
        <h1 class="welcome">Вход</h1>
        <img id="character" src="/img/Сова пнг без фона/1.png" alt="Человек" />

        <div class="inputs-container">
            <div class="field-group">
                <label class="username">Имя пользователя</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/user 1.svg" class="icon_user">
                    <input class="field-input" id="input1" type="text" placeholder="Введите ваше имя пользователя" />
                </div>
            </div>

            <div class="field-group field-group2">
                <label class="password">Пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input2" type="password" placeholder="Введите ваш пароль" />
                </div>
            </div>
            
            <button type="button" class="btn" onclick="login()">Войти</button>
            
            <p class="TEXT">Если у вас нет аккаунта, зарегистрируйтесь <a href="register.html" class="link">здесь!</a></p>
            
            <p class="message" id="message"></p>
        </div>
    </div>


    <script>
        const character = document.getElementById('character');
        const input1 = document.getElementById('input1');
        const input2 = document.getElementById('input2');
        let currentFrame = 5;

        let input2Active = false;
        let animationInterval = null;

        function playAnimation(startFrame, endFrame, callback) {
            clearInterval(animationInterval);
            let frame = startFrame;
            animationInterval = setInterval(() => {
                character.src = `/img/Сова пнг без фона/${frame}.png`;
                frame++;
                if (frame > endFrame) {
                    clearInterval(animationInterval);
                    if (callback) callback();
                }
            }, 1);
        }

        input1.addEventListener('focus', function() {
            playAnimation(currentFrame, 5);
        });

        input1.addEventListener('input', function(event) {
            if (event.inputType === "deleteContentBackward") {
                if (currentFrame > 5) {
                    currentFrame--;
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                }
            } else {
                if (currentFrame < 26) {
                    character.src = `/img/Сова пнг без фона/${currentFrame}.png`;
                    currentFrame++;
                }
            }
        });

        input1.addEventListener('blur', function() {
            if (!input2.matches(':focus')) {
                playAnimation(currentFrame, 30);
            }
        });

        input2.addEventListener('focus', function() {
            clearInterval(animationInterval);
            if (!input2Active) {
                playAnimation(26, 32);
                input2Active = true;
            }
        });

        input2.addEventListener('input', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('focus', function() {
            character.src = `/img/Сова пнг без фона/32.png`;
        });

        input2.addEventListener('blur', function() {
            character.src = "/img/Сова пнг без фона/1.png";
        });

        async function login() {
            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('input1').value);
            formData.append('password', document.getElementById('input2').value);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData,
                    credentials: 'include'
                });

                if (response.ok) {
                    // Проверяем авторизацию после успешного входа
                    const authCheck = await fetch('/api/check-auth', {
                        credentials: 'include'
                    });

                    if (authCheck.ok) {
                        window.location.href = '/static/tasks.html';
                    } else {
                        document.getElementById('message').textContent = 'Ошибка проверки авторизации';
                    }
                } else {
                    const error = await response.json();
                    document.getElementById('message').textContent = error.detail || 'Ошибка входа';
                }
            } catch (e) {
                document.getElementById('message').textContent = 'Ошибка соединения';
            }
        }
    </script>
</body>
</html>
