<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/login.css">
    <title>Вход</title>

</head>
<body>
    <div class="animation-container">
        <h1 class="welcome">Вход</h1>
        <img id="character" src="/img/Сова пнг без фона/1.png" alt="Человек" />

        <div class="inputs-container">
            <div class="field-group">
                <label class="username">Имя пользователя</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/user 1.svg" class="icon_user">
                    <input class="field-input" id="input1" type="text" placeholder="Введите ваше имя пользователя" />
                </div>
            </div>

            <div class="field-group field-group2">
                <label class="password">Пароль</label>
                <div class="field-wrapper">
                    <img src="/img/Сова пнг без фона/padlock 1.svg" class="icon_lock">
                    <input class="field-input" id="input2" type="password" placeholder="Введите ваш пароль" />
                </div>
            </div>
            
            <button type="button" class="btn" onclick="login()">Войти</button>
            
            <p class="TEXT">Если у вас нет аккаунта, зарегистрируйтесь <a href="register.html" class="link">здесь!</a></p>
            
            <p class="message" id="message"></p>
        </div>
    </div>

<script src="/JS_scripts/login.js"></script>

</body>
</html>
