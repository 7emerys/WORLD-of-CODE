<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <title>Настройки аккаунта</title>
    <style>
        * {
            font-family: 'Montserrat Alternates', sans-serif;  
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            background-image: url('../img/Frame 21.png');
            position: relative;
        }
        .account-settings {
            position: absolute;
            top: 55px;
            left: 85px;
            color: white;
        }
        .account-settings h1 {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn_Profile, .btn_psw {
            background-color: transparent;
            color: #999999;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: block;
            margin-bottom: 15px;
            text-align: left;
            padding: 5px 0;
        }
        .btn_Profile:hover, .btn_psw:hover {
            color: #fff;
        }
        .center-container {
            display: flex;
            justify-content: center;
            padding-top: 80px;
        }
        .container {
            width: 423px;
            min-height: 801px;
            background-color: transparent;
            border-radius: 15px;
            padding: 20px;
            color: #999999;
        }
        
        .pseudo-container {
            width: 100%;
            padding: 15px;
            position: relative;
        }
        .pseudo-label {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        .pseudo-label1 {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            margin-top: 50%;
        }
        .pseudo-label-text {
            font-size: 14px;
            color: #999999;
            font-weight: bold;
        }

        .pseudo-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }
        .pseudo-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #999999;
            background-color: rgba(22, 25, 28, 0.66);
            padding: 12px 15px;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }
        .pseudo-input::placeholder {
            color: #666;
        }
        .pseudo-input-border {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 10px;
            background: linear-gradient(to bottom, #BDEE60, #005436);
            z-index: 0;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }
        .buttons-container {
            display: flex;
            justify-content: left;
            margin-top: 25px;
            gap: 15px;
        }
        
        .btn_save {
            background-color: #0069FF;
            border-radius: 40px;
            color: #fff;
            padding: 13px 20px;
            border: none;
            cursor: pointer;
            flex: 1;
        }
        
        .btn_cancel {
            background-color: transparent;
            border-radius: 40px;
            color: #999999;
            padding: 8px 15px;
            border: 1px solid #999999;
            cursor: pointer;
            flex: 1;
            margin-right: 20%;
        }
    </style>
</head>
<body>
<div class="account-settings">
        <h1>Настройки аккаунта</h1>
        <button class="btn_Profile" onclick="location.href='setting.html'">Изменить профиль</button>
        <button class="btn_psw" onclick="location.href='setting_password.html'">Изменить пароль</button>
    </div>
    
    <div class="center-container">
        <div class="container">
            <div class="pseudo-container">
                <div class="pseudo-label1">
                    <span class="pseudo-label-text">Введите старый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="text" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Введите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="text" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Подтвердите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="text" class="pseudo-input">
                </div>

                <div class="buttons-container">
                    <button class="btn_save">Сохранить</button>
                    <button class="btn_cancel">Отменить</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
