<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <title>Настройки аккаунта</title>
    <style>
        * {
            font-family: 'Montserrat Alternates', sans-serif;  
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Montserrat Alternates', sans-serif;
            min-height: 100vh;
            background-color: #000;
            color: #fff;
            background-image: url('../img/Frame 21.png');
            background-size: cover;
            background-position: center;
            position: relative;
            padding: 1rem;
        }
        .account-settings {
            position: relative;
            margin-bottom: 2rem;
            text-align: center;
            color: white;
        }
        .account-settings h1 {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin-bottom: 1.5rem;
        }
        .btn_Profile, .btn_psw {
            background-color: transparent;
            color: #999999;
            border: none;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            display: block;
            margin: 0 auto 0.8rem;
            text-align: center;
            padding: 0.5rem 1rem;
            width: fit-content;
        }
        .btn_Profile:hover, .btn_psw:hover {
            color: #fff;
        }
        .center-container {
            display: flex;
            justify-content: center;
            padding-top: 1rem;
        }
        .container {
            width: min(90%, 423px);
            min-height: auto;
            background-color: transparent;
            border-radius: 15px;
            padding: 1.2rem;
            color: #999999;
            margin: 0 auto;
        }
        
        .pseudo-container {
            width: 100%;
            padding: 0.8rem;
            position: relative;
        }
        .pseudo-label {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .pseudo-label1 {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            margin-top: 2rem;
        }
        .pseudo-label-text {
            font-size: clamp(0.8rem, 3vw, 0.9rem);
            color: #999999;
            font-weight: bold;
        }

        .pseudo-input-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 1.5rem;
        }
        .pseudo-input {
            width: 100%;
            border: none;
            outline: none;
            font-size: clamp(0.9rem, 3vw, 1rem);
            color: #999999;
            background-color: rgba(22, 25, 28, 0.66);
            padding: 0.8rem 1rem;
            border-radius: 8px;
            position: relative;
            z-index: 1;
        }
        .pseudo-input::placeholder {
            color: #666;
        }
        .pseudo-input-border {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 10px;
            background: linear-gradient(to bottom, #BDEE60, #005436);
            z-index: 0;
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            padding: 2px;
        }
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }
        
        .btn_save {
            background-color: #0069FF;
            border-radius: 40px;
            color: #fff;
            padding: 0.8rem 1.2rem;
            border: none;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1rem);
            width: 100%;
        }
        
        .btn_cancel {
            background-color: transparent;
            border-radius: 40px;
            color: #999999;
            padding: 0.7rem 1.2rem;
            border: 1px solid #999999;
            cursor: pointer;
            font-size: clamp(0.9rem, 3vw, 1rem);
            width: 100%;
        }

        /* Медиа-запросы для адаптивности */
        @media (min-width: 768px) {
            body {
                padding: 1.5rem;
            }
            
            .account-settings {
                position: absolute;
                top: 3.5rem;
                left: 5rem;
                text-align: left;
            }
            
            .btn_Profile, .btn_psw {
                margin: 0 0 1rem 0;
                text-align: left;
            }
            
            .buttons-container {
                flex-direction: row;
                justify-content: flex-start;
            }
            
            .btn_save, .btn_cancel {
                width: auto;
                flex: 1;
            }
            
            .btn_cancel {
                margin-right: 0;
                flex: 1;
            }
        }

        @media (min-width: 1024px) {
            .account-settings {
                left: 6rem;
            }
            
            .container {
                width: 423px;
            }
            
            .pseudo-label1 {
                margin-top: 3rem;
            }
            
            .buttons-container {
                gap: 1rem;
            }
            
            .btn_save {
                padding: 0.8rem 1.5rem;
            }
            
            .btn_cancel {
                padding: 0.7rem 1.5rem;
                margin-right: 20%;
            }
        }

        @media (max-width: 480px) {
            .pseudo-label1 {
                margin-top: 1.5rem;
            }
            
            .buttons-container {
                gap: 0.8rem;
            }
            
            .btn_cancel {
                margin-right: 0;
            }
        }

        @media (max-width: 360px) {
            .pseudo-container {
                padding: 0.5rem;
            }
            
            .pseudo-input {
                padding: 0.7rem 0.9rem;
            }
            
            .btn_save, .btn_cancel {
                padding: 0.7rem 1rem;
            }
        }
    </style>
</head>
<body>
<div class="account-settings">
        <h1>Настройки аккаунта</h1>
        <button class="btn_Profile" onclick="location.href='setting.html'">Изменить профиль</button>
        <button class="btn_psw" onclick="location.href='setting_password.html'">Изменить пароль</button>
    </div>
    
    <div class="center-container">
        <div class="container">
            <div class="pseudo-container">
                <div class="pseudo-label1">
                    <span class="pseudo-label-text">Введите старый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Введите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Подтвердите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>

                <div class="buttons-container">
                    <button class="btn_save">Сохранить</button>
                    <button class="btn_cancel">Отменить</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
