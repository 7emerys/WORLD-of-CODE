<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/setting_password.css">
    <script src="/JS_scripts/setting_password.js"></script>
    <title>Настройки аккаунта</title>
    
</head>
<body>
<div class="account-settings">
        <h1>Настройки аккаунта</h1>
        <button class="btn_Profile" onclick="location.href='setting.html'">Изменить профиль</button>
        <button class="btn_psw" onclick="location.href='setting_password.html'">Изменить пароль</button>
        <button class="btn_psw" onclick="location.href='tasks.html'">Вернуться к решению задач</button>
    </div>
    
    <div class="center-container">
        <div class="container">
            <div class="pseudo-container">
                <div class="pseudo-label1">
                    <span class="pseudo-label-text">Введите старый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Введите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>
                <div class="pseudo-label">
                    <span class="pseudo-label-text">Подтвердите новый пароль</span>
                </div>
                <div class="pseudo-input-wrapper">
                    <div class="pseudo-input-border"></div>
                    <input type="password" class="pseudo-input">
                </div>

                <div class="buttons-container">
                    <button class="btn_save">Сохранить</button>
                    <button class="btn_cancel">Отменить</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
